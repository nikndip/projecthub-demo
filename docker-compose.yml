services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: projecthub
      POSTGRES_USER: projecthub
      POSTGRES_PASSWORD: projecthub
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projecthub -d projecthub"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      APP_ADDR: :8080
      DATABASE_URL: postgres://projecthub:projecthub@db:5432/projecthub?sslmode=disable
    ports:
      - "${HOST_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
